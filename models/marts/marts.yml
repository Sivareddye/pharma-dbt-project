version: 2

models:

  - name: mart_product_performance
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: mart_provider_performance
    columns:
      - name: provider_id
        data_tests:
          - not_null
          - unique

  - name: mart_claim_analysis
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

  - name: mart_patient_adherence
    columns:
      - name: patient_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

  - name: mart_sales_performance
    columns:
      - name: sales_date
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: territory_id
        data_tests:
          - not_null

  - name: mart_safety_signals
    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique