version: 2

models:
  - name: stg_patients
    description: Cleaned staging model for patient data.

    columns:
      - name: patient_id
        description: Unique patient identifier.
        data_tests:
          - not_null
          - unique

      - name: patient_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - INACTIVE