version: 2

models:

  - name: stg_patients
    description: Cleaned patient master data.

    columns:
      - name: patient_id
        data_tests:
          - not_null
          - unique

      - name: patient_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - INACTIVE


  - name: stg_providers
    description: Cleaned healthcare provider data.

    columns:
      - name: provider_id
        data_tests:
          - not_null
          - unique

      - name: npi_number
        data_tests:
          - not_null

      - name: provider_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - INACTIVE


  - name: stg_products
    description: Cleaned pharmaceutical product master data.

    columns:
      - name: product_id
        data_tests:
          - not_null
          - unique

      - name: product_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - ACTIVE
                  - INACTIVE


  - name: stg_territories
    description: Cleaned pharma sales territory hierarchy.

    columns:
      - name: territory_id
        data_tests:
          - not_null
          - unique


  - name: stg_prescriptions
    description: Cleaned prescription transaction data.

    columns:
      - name: prescription_id
        data_tests:
          - not_null
          - unique

      - name: patient_id
        data_tests:
          - not_null

      - name: provider_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: prescription_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - FILLED
                  - CANCELLED


  - name: stg_claims
    description: Cleaned pharmaceutical insurance claims.

    columns:
      - name: claim_id
        data_tests:
          - not_null
          - unique

      - name: prescription_id
        data_tests:
          - not_null

      - name: claim_status
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - APPROVED
                  - REJECTED


  - name: stg_sales
    description: Cleaned pharmaceutical sales transactions.

    columns:
      - name: sales_id
        data_tests:
          - not_null
          - unique

      - name: product_id
        data_tests:
          - not_null

      - name: territory_id
        data_tests:
          - not_null


  - name: stg_adverse_events
    description: Cleaned pharmaceutical adverse event data.

    columns:
      - name: event_id
        data_tests:
          - not_null
          - unique

      - name: patient_id
        data_tests:
          - not_null

      - name: product_id
        data_tests:
          - not_null

      - name: severity
        data_tests:
          - accepted_values:
              arguments:
                values:
                  - MILD
                  - MODERATE
                  - SEVERE